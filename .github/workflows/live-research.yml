name: Live Research Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  live-research:
    name: real research providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe research providers against live APIs
        run: python -m pytest tests -q -m live_research
      - name: Record provider availability snapshot
        if: always()
        run: python -m pebs.cli status > provider-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-research-status
          path: provider-status.json
          if-no-files-found: ignore
