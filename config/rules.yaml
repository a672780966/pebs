ruleset: v1
word_counting:
  scope_include:
    - narration_body
    - case_within_narration
  scope_exclude:
    - title
    - visual_instruction
    - citation_index
    - standalone_notes
  method: unicode_non_whitespace_chars
  include_punctuation: true
budgets:
  model_calls: 40
  research_requests: 20
  run_seconds: 1800
# M6 §13/§48：PCK 前置条件允许消费的 Claim 状态（默认只允许 SUPPORTED）。
# 生产"实践型"课程（如"观察记录应区分事实与判断"）时，真实文献往往只支持到
# QUALIFY_REQUIRED（文本已带限定语）。如需放行，必须在此显式声明并保留限定语，
# 不得改写为确定结论；默认值保持最严格。
evidence:
  pck_claim_statuses:
    - SUPPORTED
  # M6 §22/§48：概念/态度/反思型课程可能**没有**实证 Claim（例如"理解心理学有什么用"）。
  # 默认 false：0 条 Claim 即失败，避免用空证据继续生产。
  # 操作者显式设为 true 时，claims 步骤会产出"声明无实证 Claim"的空 claims_set，
  # PCK 允许继续但产物必须标注限制（run/step note 与 evidence_index 均记录）。
  allow_empty_claims: false
timeouts:
  read_seconds: 60
  model_seconds: 180
  export_seconds: 120
retries:
  read_transient: 2
  qa_fix_rounds: 2
limits:
  max_files_per_import: 20
  max_file_mib: 25
  max_total_mib: 100
# M6 §60：进入 LLM 的输入预算。超过时必须在产物里显式记账并 summarize/chunk/reject，
# 禁止静默截断（模板截断会破坏格式约束，材料截断会丢失证据）。
input_budget:
  max_material_chars: 120000
  max_template_chars: 60000
  max_sections: 40
  max_files: 20
  on_exceed: reject
concurrency:
  max_parallel_steps: 2
planner:
  mode: static
runtime:
  max_parallel_llm: 3
  max_parallel_research: 2
  max_parallel_sandbox: 1
m4:
  pptx: true
  pptx_renderer_required_for_formal: true
