[pytest]
testpaths = tests
markers =
    unit: fast deterministic checks
    integration: exercises multi-step pipelines, renderers, or external binaries
    external: requires network or external providers
    sandbox: requires a verified sandbox adapter
    security: permission, PII, or safety boundary checks
    e2e: end-to-end acceptance runs
    benchmark_smoke: hermetic golden-benchmark checks (no model calls, no network)
    live_research: real research providers (scheduled/manual CI only)
